<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { text-align: center; border: 1px solid #30363d; border-radius: 10px; padding: 48px 64px; background: #161b22; }
        .code { font-size: 4rem; font-weight: bold; color: #b91c1c; }
        .msg { font-size: 1.1rem; color: #8b949e; margin-top: 12px; }
        a { display: inline-block; margin-top: 24px; color: #f0883e; text-decoration: none; font-size: 0.85rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">403</div>
        <div class="msg">Forbidden — you don't have permission to access this resource.</div>
        <a href="/">← Back to home</a>
    </div>
</body>
</html>
