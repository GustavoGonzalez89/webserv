server {
    server_name tester_server;
    host 127.0.0.1;
    listen 8001;

    root ./www;
    index index.html;
    client_max_body_size 100000;

    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 500 /error_pages/500.html;

    location / {
        root ./www;
        allow_methods GET;
        index index.html;
    }

    location /directory {
        root ./YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex on;
    }

    location /post_body {
        root ./www;
        allow_methods POST;
        client_max_body_size 100;
    }

    location /cgi-bin {
        root ./YoupiBanane;
        allow_methods POST GET;
        cgi_path ./cgi_tester(1);
        cgi_ext .bla;
    }
}
