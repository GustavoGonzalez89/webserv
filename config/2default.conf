server {
	server_name default_server;
    host 127.0.0.1;
	listen 8001;
	client_max_body_size 10485760;
    #Comment part, not to parse

	root    ./www;

	error_page      403 /error_pages/403.html;
	error_page      404 /error_pages/404.html;
	error_page      413 /error_pages/413.html;
	error_page      500 /error_pages/500.html;

	location / {
		root ./www;
		index index.html;
		allow_methods GET;
		autoindex on;
	}

	location /Post {
		root ./www/db;
		allow_methods GET POST DELETE;
		autoindex on;
	}

	location /upload {
		root ./www/upload;
		allow_methods GET POST;
		autoindex on;
	}

	location /cgi-bin {
		root ./www/cgi-bin;
		allow_methods GET POST;
		cgi_path /bin/bash;
		cgi_ext .sh;
	}

	location /git {
		redirect 301 http://github.com;
	}
}


#Comment to test
server {
    listen 8001;
	server_name localhost;
    host 127.0.0.1;
    root ./www_server2;
    client_max_body_size 10000000;
	index index.html;
    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 413 /error_pages/413.html;
    error_page 500 /error_pages/500.html;

    location / {
        root ./www_server2;
        allow_methods DELETE POST GET;
        autoindex off;
    }

    location /db {
        root ./www_server2/db;
        allow_methods GET POST DELETE;
        autoindex on;
    }

    location /tours {
        root ./www_server2/tours;
        autoindex on;
        index tours1.html;
        allow_methods GET POST;
    }

	location /red {
		redirect 301 /tours;
	}

    location /cgi-bin {
        root ./www_server2/cgi-bin;
        allow_methods GET POST DELETE;
        cgi_path /bin/bash;
        cgi_ext .sh;
    }
}
